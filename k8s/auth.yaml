apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: nova
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
      - name: auth
        image: novaglobal/auth:latest
        ports:
        - containerPort: 8001
        env:
        - name: REDIS_HOST
          value: redis
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nova-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: nova
spec:
  ports:
  - port: 8001
    targetPort: 8001
  selector:
    app: auth
