[program:nova-redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
user=redis
redirect_stderr=true
stdout_logfile=/root/nova-global-keys-/logs/redis.log

[program:nova-gateway]
command=/root/nova-global-keys-/venv/bin/uvicorn gateway.main:app --host 127.0.0.1 --port 8081
directory=/root/nova-global-keys-/services
environment=PYTHONPATH=/root/nova-global-keys-/services
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/root/nova-global-keys-/logs/gateway/gateway.log
stderr_logfile=/root/nova-global-keys-/logs/gateway/error.log

